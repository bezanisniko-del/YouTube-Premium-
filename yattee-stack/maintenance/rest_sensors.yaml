# Health sensors for the Yattee Server add-on.
#
# Paste into configuration.yaml (or into a package file). If you already have a
# `rest:` block, merge the list items rather than duplicating the key.
#
# The two secrets go in secrets.yaml, never here:
#   yattee_server_user: admin
#   yattee_server_pass: <the add-on's admin_password>
#
# Host: the add-on publishes 8085 on the Home Assistant host, so from HA Core
# the address is the host's own. Use the tailnet name or the LAN IP — NOT
# 127.0.0.1, which resolves inside the HA Core container, not the host.

rest:
  # --- liveness -------------------------------------------------------------
  # /health is public (basic_auth.py PUBLIC_PATHS), so no credentials needed.
  - resource: http://homeassistant.local:8085/health
    scan_interval: 300
    timeout: 15
    sensor:
      - name: Yattee Server status
        unique_id: yattee_server_status
        value_template: "{{ value_json.status | default('unreachable') }}"
        icon: mdi:server-network

  # --- version and yt-dlp currency -----------------------------------------
  # /info returns {"name": "yattee-server"} unauthenticated and the full payload
  # authenticated (basic_auth.py:165-186), so a missing dependencies key here
  # means the credentials are wrong.
  - resource: http://homeassistant.local:8085/info
    scan_interval: 3600
    timeout: 20
    username: !secret yattee_server_user
    password: !secret yattee_server_pass
    authentication: basic
    sensor:
      # Named without the hyphen on purpose: Home Assistant derives the
      # entity_id by slugifying the name, and "yt-dlp" would become
      # sensor.yattee_server_yt_dlp_version — easy to mistype against the
      # unique_id. This way both read yattee_server_ytdlp_version.
      - name: Yattee Server ytdlp version
        unique_id: yattee_server_ytdlp_version
        value_template: >-
          {{ value_json.dependencies['yt-dlp'] | default('unauthenticated') }}
        icon: mdi:download-box

  # --- end-to-end extraction ------------------------------------------------
  # The real regression check. If yt-dlp has broken against YouTube this stops
  # returning "Rick Astley" while /health stays perfectly green — which is
  # exactly the failure that would otherwise go unnoticed until you tried to
  # watch something.
  #
  # 30 min is deliberate: each poll is a real extraction. Do not lower it.
  - resource: http://homeassistant.local:8085/api/v1/videos/dQw4w9WgXcQ
    scan_interval: 1800
    timeout: 60
    username: !secret yattee_server_user
    password: !secret yattee_server_pass
    authentication: basic
    sensor:
      - name: Yattee Server extraction
        unique_id: yattee_server_extraction
        value_template: >-
          {% set author = value_json.author | default('') %}
          {% set formats = (value_json.formatStreams | default([]) | length)
                         + (value_json.adaptiveFormats | default([]) | length) %}
          {% if author == 'Rick Astley' and formats > 0 %}ok
          {% elif formats > 0 %}wrong-video
          {% else %}broken{% endif %}
        json_attributes:
          - extractionMethod

template:
  - binary_sensor:
      - name: Yattee Server healthy
        unique_id: yattee_server_healthy
        device_class: problem
        # device_class: problem inverts the reading: "on" means there IS a
        # problem, which is what the automation below triggers on.
        state: >-
          {{ states('sensor.yattee_server_status') != 'ok'
             or states('sensor.yattee_server_extraction') != 'ok' }}
        availability: >-
          {{ states('sensor.yattee_server_status') not in
             ['unknown', 'unavailable'] }}
